<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your cart — Pebble & Pine</title>
  <link rel="stylesheet" href="shop-styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <a class="shop-logo" href="index.html">
      <svg class="shop-logo-mark" aria-hidden="true" focusable="false" viewBox="0 0 32 32" width="32" height="32">
        <ellipse cx="11" cy="23" rx="9" ry="6" fill="#8a9a92"/>
        <path d="M23 3 L31 25 H15 Z" fill="#2f5d43"/>
      </svg>
      <span>Pebble & Pine</span>
    </a>
    <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="main-menu">Menu</button>
    <nav class="main-nav" id="main-menu" aria-label="Main">
      <ul>
        <li><a class="nav-link" href="index.html">Shop</a></li>
        <li><a class="nav-link" href="product-linen-tote-bag.html">Tote bag</a></li>
        <li><a class="nav-link" href="cart.html" aria-current="page">Cart</a></li>
        <li><a class="nav-link" href="checkout.html">Checkout</a></li>
      </ul>
    </nav>
    <button type="button" class="cart-button" aria-label="Cart">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="24" height="24">
        <path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.7L20.5 8H6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9.5" cy="19" r="1.6" fill="currentColor"/>
        <circle cx="17" cy="19" r="1.6" fill="currentColor"/>
      </svg>
    </button>
  </header>

  <main id="main-content">
    <h1 id="cart-heading" tabindex="-1">Your cart</h1>
    <ul class="cart-items" aria-labelledby="cart-heading">
      <li class="cart-item" data-item-id="linen-tote-bag" data-item-name="Linen tote bag" data-item-price="24">
        <span class="cart-item-name">Linen tote bag</span>
        <span class="cart-item-price">$24.00</span>
        <button type="button" class="remove-button">Remove<span class="visually-hidden"> Linen tote bag</span></button>
      </li>
      <li class="cart-item" data-item-id="stoneware-mug" data-item-name="Stoneware mug" data-item-price="18">
        <span class="cart-item-name">Stoneware mug</span>
        <span class="cart-item-price">$18.00</span>
        <button type="button" class="remove-button">Remove<span class="visually-hidden"> Stoneware mug</span></button>
      </li>
    </ul>
    <p class="cart-empty-message" hidden>Your cart is empty.</p>
    <p class="cart-total">Total: <span class="cart-total-amount">$42.00</span></p>
    <button type="button" class="checkout-button">Checkout</button>
    <p class="cart-status-message" role="status"></p>
  </main>

  <footer class="site-footer">
    <p>Pebble & Pine is a fictional shop made for accessibility testing. No real orders are taken.</p>
  </footer>

  <script src="shop-behaviour.js"></script>
</body>
</html>
