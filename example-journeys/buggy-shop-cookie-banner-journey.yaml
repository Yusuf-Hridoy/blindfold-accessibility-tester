# First visit: get past the cookie banner, then open a product.
# Works against either demo shop: --base-url http://localhost:4000 (buggy) or :4001 (accessible).
name: First visit, cookie banner then product
start_url: /
steps:
  - dismiss: "Accept, button"
  - reach: "Linen tote bag, link"
